<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Section with Dropdown Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ჰედერი და ნავიგაცია -->
    <header>
        <div class="nav-left">
            <div class="logo">snap</div>
            <ul class="nav-links">
                <li><a>Features ▾</a></li>
                <li><a>Company ▾</a></li>
                <li><a>Careers</a></li>
                <li><a>About</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <button class="login-btn">Login</button>
            <button class="register-btn">Register</button>
        </div>
    </header>

    <!-- მთავარი სექცია -->
    <main class="hero-section">
        
        <!-- მარცხენა მხარე: ტექსტები -->
        <div class="hero-content">
            <h1>Make remote work</h1>
            <p>Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
            <button class="learn-more-btn">Learn more</button>

            <!-- კლიენტების ლოგოები ქვემოთ -->
            <div class="clients-logo">
                <img src="./client-databiz.svg" alt="Databiz">
                <img src="./client-audiophile.svg" alt="Audiophile">
                <img src="./client-meet.svg" alt="Meet">
                <img src="./client-maker.svg" alt="Maker">
            </div>
        </div>

        <!-- მარჯვენა მხარე: სურათი -->
        <div class="hero-image">
            <img src="./image-hero-desktop.png" alt="">
        </div>

    </main>

</body>
</html>
